[pytest]
# Only the v2 test suite and the self-contained legacy unit tests are collected.
# backend/tests/ targets the retired Azure Functions app (needs azure.functions) and is excluded.
testpaths = tests_v2 test_number_parser_suite.py test_voice_response.py
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    postgres: needs a reachable Postgres (set TEST_POSTGRES_URL)
    live: makes real network calls to paid/free external APIs
