<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyTrace — Autonomous Financial Emergency Response</title>
  <meta name="description" content="Autonomous financial emergency response platform for payment fraud and cyber financial crimes." />
  
  <!-- Plus Jakarta Sans Typography (Fintech Standard) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- MoneyTrace Unified Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- Full Viewport Application Shell (Edge-to-Edge) -->
  <div class="app-shell" id="appShellRoot">

    <!-- Top Full-Width Navigation Bar -->
    <header class="top-bar" id="appTopBar">
      <!-- Left: MoneyTrace Logo -->
      <div class="brand-section" onclick="MoneyTraceApp.navigate('/')">
        <img src="/public/moneytrace_logo.png" alt="MoneyTrace" class="brand-logo-img" id="appLogo" />
      </div>

      <!-- Center: Context Breadcrumb / Page Title -->
      <div class="top-bar-center" id="topBarCenter">
        <div class="view-heading-tag" id="viewContextTitle">
          <!-- Rendered dynamically based on view -->
        </div>
      </div>

      <!-- Right: Live Indicator, Notifications, User Pill (or Login CTA on public pages) -->
      <div class="top-bar-actions" id="topBarActions">
        <!-- Live SSE Stream Status -->
        <div class="sse-live-tag" id="sseBadge" title="Server-Sent Events Realtime Bus">
          <span class="pulse-dot-green"></span>
          <span id="sseText">Live Bus</span>
        </div>

        <!-- Notification Bell Trigger -->
        <button class="icon-btn" id="notifBellBtn" onclick="MoneyTraceApp.toggleNotificationsPanel()" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="notification-badge-count" id="notifCountBadge" style="display:none;">0</span>
        </button>

        <!-- Authenticated Profile Section -->
        <div class="user-pill" id="userPill" onclick="MoneyTraceApp.handleProfileClick()" title="User Account">
          <div class="user-pill-avatar" id="userAvatar">U</div>
          <div class="user-pill-info">
            <span class="user-pill-name" id="userName">User</span>
            <span class="user-pill-role" id="userRole">Loading...</span>
          </div>
        </div>

        <!-- Logout Action Button -->
        <button class="icon-btn" id="logoutBtn" onclick="MoneyTraceApp.logout()" title="Sign Out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <!-- App Body: Sidebar Rail + Fluid Content Area -->
    <div class="app-body-layout" id="appBodyLayout">
      <!-- Left Compact Navigation Rail (Role-Adaptive) -->
      <aside class="sidebar-rail" id="appSidebarRail">
        <!-- Injected dynamically based on role -->
      </aside>

      <!-- Main Fluid Content Surface (Edge-to-Edge padding) -->
      <main class="main-fluid-content" id="mainApp">
        <!-- Rendered dynamically via app.js -->
      </main>
    </div>

  </div>

  <!-- Notification Drawer / Panel -->
  <div id="notificationsDrawer" class="modal-backdrop-frosted" style="display:none;" onclick="if(event.target===this) MoneyTraceApp.toggleNotificationsPanel()">
    <div class="modal-card-elevated" style="max-width: 460px;">
      <div class="card-header-clean">
        <div>
          <h3 class="card-title-main" id="notifPanelTitle">Notifications</h3>
          <p class="card-subtitle" id="notifPanelSubtitle">Protective advisories & event activity</p>
        </div>
        <button class="icon-btn" onclick="MoneyTraceApp.toggleNotificationsPanel()">&times;</button>
      </div>
      <div id="notificationsPanelBody" style="display:flex; flex-direction:column; gap:10px; margin-top:14px; max-height:480px; overflow-y:auto;">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Global Modal for Evidence / Details -->
  <div id="modalContainer" style="display: none;"></div>

  <!-- Toast Notification Stack -->
  <div id="toastContainer" class="toast-stack"></div>

  <!-- MoneyTrace Frontend Engine -->
  <script src="/static/js/app.js"></script>
</body>
</html>
