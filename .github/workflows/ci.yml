name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: moneytrace
          POSTGRES_PASSWORD: moneytrace
          POSTGRES_DB: moneytrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moneytrace" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Unit tests (SQLite)
        run: python -m pytest -q
      - name: Unit tests (Postgres + pgvector)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://moneytrace:moneytrace@localhost:5432/moneytrace
        run: python -m pytest -q
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql://moneytrace:moneytrace@localhost:5432/moneytrace
        run: python -m alembic upgrade head

  rag-eval-gate:
    # Needs the corpus database and an LLM key; skipped (not failed) on forks / until the secrets are added.
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ github.event_name == 'pull_request' }}
    env:
      RAG_EVAL_DATABASE_URL: ${{ secrets.RAG_EVAL_DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check secrets
        id: check
        run: |
          if [ -z "$RAG_EVAL_DATABASE_URL" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "RAG gate skipped: secrets RAG_EVAL_DATABASE_URL / GEMINI_API_KEY not set"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: RAG eval on a 20-question subset
        if: steps.check.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.RAG_EVAL_DATABASE_URL }}
          LLM_PROVIDER: gemini
          EMBEDDING_PROVIDER: gemini
          OTEL_EXPORTER: none
        run: python -m evaluation.rag_eval --subset 20 --concurrency 2
      - name: Fail if recall@5 or grounding dropped below the saved baseline
        if: steps.check.outputs.skip != 'true'
        run: python -m evaluation.ci_gate results/rag_eval/latest_subset.json results/rag_eval/baseline_subset.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.skip != 'true'
        with:
          name: rag-eval-subset
          path: backend/results/rag_eval/
